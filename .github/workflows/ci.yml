name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/')
        && github.event_name != 'workflow_dispatch' }}

env:
  OPENWRT_VERSION: 25.12.4
  OPENWRT_SDK_URL: https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck generator + init script + tests
        run: |
          shellcheck files/usr/lib/unbound-uci-ext/generator.sh
          shellcheck tests/unit/generator_test.sh
          # /etc/init.d/* uses OpenWrt's /etc/rc.common syntax (not strict POSIX).
          # SC2034 (unused) and SC2154 (unassigned) fire on procd globals like
          # USE_PROCD and START that /etc/rc.common consumes via name.
          shellcheck -s dash -e SC2034,SC2154 files/etc/init.d/unbound-uci-ext

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run unit tests
        run: ./tests/unit/generator_test.sh

  release-apk:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need tag object for verify-tag

      - name: Verify tag signature
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' .github/release-signers.asc; then
            echo "ERROR: .github/release-signers.asc has no PGP public-key block."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import .github/release-signers.asc
          git verify-tag "$TAG"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl zstd

      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: build/sdk
          key: openwrt-sdk-25.12.4-x86_64

      - name: Verify SDK pin
        run: |
          SDK_TARBALL=$(basename "$OPENWRT_SDK_URL")
          grep -q "  $SDK_TARBALL\$" sdk.sha256 || {
            echo "ERROR: sdk.sha256 does not pin $SDK_TARBALL."
            exit 1
          }

      - name: Download SDK if cache miss (verified by sha256)
        run: |
          if [ ! -d build/sdk/staging_dir ]; then
            mkdir -p build/sdk
            SDK_TARBALL=$(basename "$OPENWRT_SDK_URL")
            curl -fsSL -o "/tmp/$SDK_TARBALL" "$OPENWRT_SDK_URL"
            ( cd /tmp && sha256sum --check "$GITHUB_WORKSPACE/sdk.sha256" --ignore-missing )
            tar --use-compress-program=unzstd -xf "/tmp/$SDK_TARBALL" \
                -C build/sdk --strip-components=1
            rm -f "/tmp/$SDK_TARBALL"
          fi

      - name: Build APK
        run: |
          cd build/sdk
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          ln -sfn ../../.. package/unbound-uci-ext
          make defconfig
          make package/unbound-uci-ext/compile V=s

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find build/sdk/bin -name 'unbound-uci-ext-*.apk' | head -1)
          [ -n "$APK" ] || { echo "no .apk built"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: unbound-uci-ext-apk
          path: ${{ steps.find_apk.outputs.apk }}

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              *-rc*|*-alpha*|*-beta*|*-pre*) PRE=--prerelease ;;
              *)                              PRE= ;;
            esac
            gh release create "$TAG" $PRE --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "${{ steps.find_apk.outputs.apk }}" --clobber

  # Multi-arch build verification. The package is PKGARCH:=all (pure shell +
  # UCI; no compiled code), so the build must succeed against every target
  # SDK we care about. Each matrix leg builds against its target's SDK and
  # uploads the resulting apk as an artifact for spot-checking; the build
  # itself failing on any arch holds the release. A byte-identical-installed-
  # files assertion across arches would need to extract APK v3 ADB format
  # (apk-tools v3 required; not on ubuntu-latest by default) and is left as
  # a follow-up if a real divergence ever surfaces in practice.
  verify-arch-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/armsr/armv8/openwrt-sdk-25.12.4-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: arm_cortex-a7
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/mediatek/mt7622/openwrt-sdk-25.12.4-mediatek-mt7622_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: mips_24kc
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/ath79/generic/openwrt-sdk-25.12.4-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v6
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl zstd
      - name: Cache OpenWrt SDK (${{ matrix.arch }})
        uses: actions/cache@v5
        with:
          path: build/sdk-${{ matrix.arch }}
          key: openwrt-sdk-25.12.4-${{ matrix.arch }}
      - name: Verify per-arch SDK pin
        run: |
          SDK_TARBALL=$(basename "${{ matrix.sdk_url }}")
          grep -q "  $SDK_TARBALL\$" sdk.sha256 || {
            echo "ERROR: sdk.sha256 does not pin $SDK_TARBALL."
            exit 1
          }
      - name: Download SDK if cache miss
        run: |
          if [ ! -d build/sdk-${{ matrix.arch }}/staging_dir ]; then
            mkdir -p build/sdk-${{ matrix.arch }}
            SDK_TARBALL=$(basename "${{ matrix.sdk_url }}")
            curl -fsSL -o "/tmp/$SDK_TARBALL" "${{ matrix.sdk_url }}"
            ( cd /tmp && sha256sum --check "$GITHUB_WORKSPACE/sdk.sha256" --ignore-missing )
            tar --use-compress-program=unzstd -xf "/tmp/$SDK_TARBALL" \
                -C build/sdk-${{ matrix.arch }} --strip-components=1
            rm -f "/tmp/$SDK_TARBALL"
          fi
      - name: Build APK against ${{ matrix.arch }} SDK
        run: |
          cd build/sdk-${{ matrix.arch }}
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          ln -sfn ../../.. package/unbound-uci-ext
          make defconfig
          make package/unbound-uci-ext/compile V=s
      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find build/sdk-${{ matrix.arch }}/bin -name 'unbound-uci-ext-*.apk' | head -1)
          [ -n "$APK" ] || { echo "no .apk built for ${{ matrix.arch }}"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          sha256sum "$APK"
      - name: Upload ${{ matrix.arch }} APK
        uses: actions/upload-artifact@v7
        with:
          name: unbound-uci-ext-apk-${{ matrix.arch }}
          path: ${{ steps.find_apk.outputs.apk }}
